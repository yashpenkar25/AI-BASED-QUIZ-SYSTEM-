<!DOCTYPE html>
<html>
<head>
    <title>Request Paper Setter Access</title>
    <link rel="stylesheet" href="https://unpkg.com/bulma@0.7.4/css/bulma.min.css">
</head>
<body>
    <section class="container">
        <h2 class="title">Paper Setter Registration</h2>
        <form action="/request_ps" method="POST">
            <input class="input" type="text" name="first_name" placeholder="First Name" required><br><br>
            <input class="input" type="text" name="last_name" placeholder="Last Name" required><br><br>
            <input class="input" type="email" name="email" placeholder="Email" required><br><br>
            <input class="input" type="password" name="password" placeholder="Password" required><br><br>
            <input class="input" type="text" name="username" placeholder="Username" required><br><br>
            <input class="input" type="tel" name="phone" placeholder="Phone Number" required><br><br>
            <label for="birthday">Date of Birth:</label>
            <input class="input" type="date" name="birthday" required><br><br>
            <button class="button is-success" type="submit">Submit Request</button>
        </form>
    </section>
</body>
</html>
